apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sparglim-monitor
  namespace: sparglim
  labels:
    release: prometheus 
spec:
  selector:
    matchLabels:
      app: sparglim-server
  namespaceSelector:
    matchNames:
      - sparglim
  endpoints:
    - port: spark-ui
      path: /metrics/prometheus
      interval: 15s