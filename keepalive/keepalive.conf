vrrp_instance VI_1 {
    state MASTER                 # This is the primary server
    interface enp6s18            # Change to your interface name
    virtual_router_id 51         # Must be the same on both nodes
    priority 101                 # Higher priority makes it the master
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass k3scluster
    }
    virtual_ipaddress {
        192.168.1.254/24          # This is the floating VIP
    }
}