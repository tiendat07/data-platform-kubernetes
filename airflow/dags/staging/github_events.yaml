apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: "github-events-{{ ds }}-{{ task_instance.try_number }}"
  namespace: spark-operator
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "tiendat2807/spark-lakehouse:0.0.9"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/airflow/dags/staging/github_events.py"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.0
    serviceAccount: spark
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.5.0
  arguments:
    - "{{ data_interval_start.strftime('%Y-%m-%d') }}"
    - "{{ data_interval_start.strftime('%-H') }}"
